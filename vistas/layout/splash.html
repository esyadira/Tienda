<!-- ===== SPLASH SCREEN ===== -->
<div id="splashScreen" style="display:none;position:fixed;inset:0;z-index:99999;background:linear-gradient(135deg,#f0f4ff 0%,#fafafa 50%,#fff7ed 100%);flex-direction:column;align-items:center;justify-content:center;gap:20px;">

    <div>
      <div style="font-size:22px;font-weight:800;color:#111827;letter-spacing:-0.5px;">BodegaPOS</div>

    </div>
  </div>
