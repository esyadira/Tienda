<!-- Modal Cobro -->
<div class="modal-overlay" id="modalCobro">
  <div class="modal" style="max-width:700px;">
    <div class="modal-header"><h3><i class="fa fa-cash-register" style="color:var(--accent);margin-right:8px;"></i>Registrar Cobro</h3><div class="modal-close" onclick="closeModal('modalCobro')"><i class="fa fa-xmark"></i></div></div>
    <div class="modal-body" style="padding:0;">
      <div style="display:flex;flex-wrap:wrap;">

        <!-- Columna izquierda: total, método de pago y montos -->
        <div style="flex:1 1 340px;min-width:280px;padding:24px;border-right:1px solid var(--border);">
          <div style="text-align:center;margin-bottom:16px;">
            <div style="font-size:13px;color:var(--text3);margin-bottom:4px;">Total a cobrar</div>
            <div id="cobroTotal" style="font-size:36px;font-weight:800;color:var(--accent);letter-spacing:-1px;">S/. 0.00</div>
            <div id="cobroClienteInfo" style="font-size:12px;color:var(--text3);margin-top:4px;"></div>
          </div>

          <!-- Método de pago -->
          <div class="cobro-metodos">
            <button type="button" class="cobro-metodo" data-metodo="efectivo" style="--mc:#10b981;--mcbg:rgba(16,185,129,0.12);" onclick="setMetodoCobro('efectivo')"><i class="fa fa-money-bill"></i><span>Efectivo</span></button>
            <button type="button" class="cobro-metodo" data-metodo="yape" style="--mc:#7c3aed;--mcbg:rgba(124,58,237,0.12);" onclick="setMetodoCobro('yape')"><i class="fa fa-mobile-screen"></i><span>Yape</span></button>
            <button type="button" class="cobro-metodo" data-metodo="tarjeta" style="--mc:#0ea5e9;--mcbg:rgba(14,165,233,0.12);" onclick="setMetodoCobro('tarjeta')"><i class="fa fa-credit-card"></i><span>Tarjeta</span></button>
            <button type="button" class="cobro-metodo" data-metodo="mixto" style="--mc:#f97316;--mcbg:rgba(249,115,22,0.12);" onclick="setMetodoCobro('mixto')"><i class="fa fa-shuffle"></i><span>Mixto</span></button>
          </div>

          <!-- Sección de montos: alto fijo para que no cambie el tamaño de la ventana al cambiar de método -->
          <div id="cobroMontosWrap" style="min-height:250px;">
          <!-- Efectivo / Yape: un solo monto -->
          <div class="form-field" id="cobroSimple" style="margin-bottom:16px;">
            <label id="cobroLabelMonto" style="font-size:12px;font-weight:600;color:var(--text2);display:block;margin-bottom:8px;text-transform:uppercase;letter-spacing:0.5px;">¿Cuánto te dio el cliente?</label>
            <input type="number" id="cobroMonto" placeholder="0.00" step="0.10" min="0"
              style="width:100%;padding:12px 14px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text);font-family:'Sora',sans-serif;font-size:18px;font-weight:700;text-align:center;"
              oninput="calcCambio()">
            <div style="display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;" id="cobroBotonesContainer">
              <button class="btn btn-secondary btn-sm" id="btnFiar" onclick="setMonto(0)" style="display:none;">S/. 0 (fiar)</button>
            </div>
          </div>

          <!-- Tarjeta: se cobra el monto exacto, aquí solo se registra la referencia/voucher -->
          <div class="form-field" id="cobroTarjeta" style="display:none;margin-bottom:16px;">
            <label style="font-size:12px;font-weight:600;color:var(--text2);display:block;margin-bottom:8px;text-transform:uppercase;letter-spacing:0.5px;">Referencia del pago</label>
            <input type="text" id="cobroReferencia" placeholder="N.° de aprobación, últimos 4 dígitos, etc."
              style="width:100%;padding:12px 14px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text);font-family:'Sora',sans-serif;font-size:14px;">
            <div style="font-size:11px;color:var(--text3);margin-top:6px;">Opcional. Se imprime en el ticket para tus registros.</div>
          </div>

          <!-- Mixto: monto por cada método -->
          <div id="cobroMixto" style="display:none;margin-bottom:16px;">
            <label style="font-size:12px;font-weight:600;color:var(--text2);display:block;margin-bottom:8px;text-transform:uppercase;letter-spacing:0.5px;">¿Cuánto paga con cada método?</label>
            <div class="mixto-row" style="--mc:#10b981;">
              <span class="mixto-lbl"><i class="fa fa-money-bill"></i> Efectivo</span>
              <input type="number" id="mixtoEfectivo" placeholder="0.00" step="0.10" min="0" oninput="calcCambio()">
              <button type="button" class="mixto-resto" onclick="mixtoResto('mixtoEfectivo')">Resto</button>
            </div>
            <div class="mixto-row" id="mixtoRowYape" style="--mc:#7c3aed;">
              <span class="mixto-lbl"><i class="fa fa-mobile-screen"></i> Yape</span>
              <input type="number" id="mixtoYape" placeholder="0.00" step="0.10" min="0" oninput="calcCambio()">
              <button type="button" class="mixto-resto" onclick="mixtoResto('mixtoYape')">Resto</button>
            </div>
            <div class="mixto-row" id="mixtoRowTarjeta" style="--mc:#0ea5e9;">
              <span class="mixto-lbl"><i class="fa fa-credit-card"></i> Tarjeta</span>
              <input type="number" id="mixtoTarjeta" placeholder="0.00" step="0.10" min="0" oninput="calcCambio()">
              <button type="button" class="mixto-resto" onclick="mixtoResto('mixtoTarjeta')">Resto</button>
            </div>
            <input type="text" id="mixtoTarjetaRef" placeholder="Referencia de la tarjeta (opcional)"
              style="width:100%;margin:-2px 0 8px;padding:8px 12px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text);font-family:'Sora',sans-serif;font-size:12px;">
          </div>
          </div>

          <div id="cobroResultado" style="padding:14px;border-radius:var(--radius-sm);background:var(--surface2);border:1px solid var(--border);text-align:center;font-size:15px;font-weight:700;display:none;"></div>
        </div>

        <!-- Columna derecha: acciones, nota y resumen -->
        <div style="flex:0 0 230px;min-width:200px;padding:24px;background:var(--surface2);display:flex;flex-direction:column;gap:10px;">
          <button class="btn btn-primary" onclick="confirmarCobro(true)" style="width:100%;justify-content:center;font-size:14px;padding:12px 16px;">
            Cobrar e Imprimir
          </button>
          <button class="btn btn-secondary" onclick="confirmarCobro(false)" style="width:100%;justify-content:center;">
            Cobrar sin Imprimir
          </button>

          <button type="button" id="btnToggleCobroNota" onclick="toggleCobroNota()"
            style="margin-top:6px;background:var(--surface);border:1px dashed var(--border);border-radius:10px;padding:10px 12px;font-size:12px;font-weight:700;color:var(--text2);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;">
            <i class="fa fa-note-sticky"></i> Ingresar nota
          </button>
          <div id="cobroNotaBox" style="display:none;">
            <textarea id="cobroNotaTexto" rows="3" placeholder="Nota sobre esta venta (opcional)"
              style="width:100%;resize:vertical;padding:10px 12px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text);font-family:'Sora',sans-serif;font-size:13px;"></textarea>
          </div>

          <div style="flex:1;"></div>

          <div style="text-align:center;padding-top:10px;border-top:1px solid var(--border);">
            <div style="font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:2px;">Total de Artículos</div>
            <div id="cobroTotalArticulos" style="font-size:22px;font-weight:800;color:var(--accent);">0</div>
          </div>
        </div>

      </div>
    </div>
  </div>
</div>
