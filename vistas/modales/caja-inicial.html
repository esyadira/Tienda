<!-- Efectivo en caja: aparece al iniciar sesión, antes de mostrar el sistema (ver js/caja.js) -->
<div id="modalCajaInicial" class="caja-overlay">
  <div class="caja-card">
    <div class="caja-icon"><i class="fa fa-cash-register"></i></div>
    <h3>Efectivo en caja</h3>
    <p id="cajaSubtitulo" class="caja-sub">¿Con cuánto efectivo empiezas?</p>

    <div class="caja-input-wrap">
      <span id="cajaMoneda">S/.</span>
      <input type="number" id="cajaMontoInput" placeholder="0.00" step="0.10" min="0" inputmode="decimal"
        onkeydown="if(event.key==='Enter')confirmarCajaInicial()" oninput="document.getElementById('cajaError').style.display='none'">
    </div>
    <div id="cajaError" class="caja-error">Ingresa un monto válido (puede ser 0).</div>

    <button class="btn btn-primary caja-btn" onclick="confirmarCajaInicial()"><i class="fa fa-check"></i> Iniciar turno</button>

    <div id="cajaPrevio" class="caja-previo" style="display:none;">
      <span id="cajaPrevioTxt"></span>
      <button class="caja-link" onclick="mantenerCajaPrevia()">Continuar con ese monto</button>
    </div>

    <button class="caja-link caja-salir" onclick="cancelarCajaInicial()">Cerrar sesión</button>
  </div>
</div>
