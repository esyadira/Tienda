<!-- ===== MODAL: ARTÍCULO COMÚN ===== -->
<div class="modal-overlay" id="modalArticuloComun">
  <div class="modal" style="max-width:380px;">
    <div class="modal-header">
      <h3><i class="fa fa-tag" style="color:#0ea5e9;margin-right:8px;"></i>Artículo Común</h3>
      <div class="modal-close" onclick="closeModal('modalArticuloComun')"><i class="fa fa-xmark"></i></div>
    </div>
    <div class="modal-body">
      <p style="font-size:12px;color:var(--text3);margin-bottom:14px;">Agrega un artículo suelto al carrito, sin necesidad de tenerlo registrado en tu inventario.</p>
      <div class="form-field">
        <label>Nombre del Artículo *</label>
        <input type="text" id="acNombre" placeholder="Ej: Bolsa, Servicio, Varios...">
      </div>
      <div class="form-field">
        <label>Precio Unitario (<span id="acMonedaLbl"></span>) *</label>
        <input type="number" id="acPrecio" placeholder="0.00" step="0.10" min="0">
      </div>
      <div class="form-field">
        <label>Cantidad</label>
        <input type="number" id="acCantidad" value="1" step="1" min="1">
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeModal('modalArticuloComun')">Cancelar</button>
      <button class="btn btn-primary" onclick="agregarArticuloComun()"><i class="fa fa-cart-plus"></i> Agregar al Carrito</button>
    </div>
  </div>
</div>

<!-- ===== MODAL: CONSULTAR PRECIO ===== -->
<div class="modal-overlay" id="modalConsultarPrecio">
  <div class="modal modal-alto-fijo" style="max-width:420px;--alto:520px;">
    <div class="modal-header">
      <h3><i class="fa fa-magnifying-glass-dollar" style="color:#8b5cf6;margin-right:8px;"></i>Consultar Precio</h3>
      <div class="modal-close" onclick="closeModal('modalConsultarPrecio')"><i class="fa fa-xmark"></i></div>
    </div>
    <div class="modal-body">
      <div class="table-search" style="margin-bottom:12px;">
        <i class="fa fa-magnifying-glass"></i>
        <input type="text" id="consultarPrecioInput" placeholder="Buscar o escanear código..." autocomplete="off" oninput="buscarConsultarPrecio(this.value)">
      </div>
      <div id="consultarPrecioResultados"></div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" style="width:100%;" onclick="closeModal('modalConsultarPrecio')">Cerrar</button>
    </div>
  </div>
</div>

<!-- ===== MODAL: ENTRADA / SALIDA DE EFECTIVO ===== -->
<div class="modal-overlay" id="modalEntradaSalida">
  <div class="modal modal-alto-fijo" style="max-width:420px;--alto:560px;">
    <div class="modal-header">
      <h3><i class="fa fa-right-left" style="color:#f97316;margin-right:8px;"></i>Entrada / Salida de Efectivo</h3>
      <div class="modal-close" onclick="closeModal('modalEntradaSalida')"><i class="fa fa-xmark"></i></div>
    </div>
    <div class="modal-body">
      <div class="cobro-metodos" style="grid-template-columns:1fr 1fr;">
        <button type="button" class="cobro-metodo" id="esBtnEntrada" style="--mc:#10b981;--mcbg:rgba(16,185,129,0.12);" onclick="setTipoMovCaja('entrada')"><i class="fa fa-arrow-down"></i><span>Entrada</span></button>
        <button type="button" class="cobro-metodo" id="esBtnSalida" style="--mc:#ef4444;--mcbg:rgba(239,68,68,0.12);" onclick="setTipoMovCaja('salida')"><i class="fa fa-arrow-up"></i><span>Salida</span></button>
      </div>
      <div class="form-field" style="margin-top:14px;">
        <label>Monto (<span id="esMonedaLbl"></span>) *</label>
        <input type="number" id="esMonto" placeholder="0.00" step="0.10" min="0">
      </div>
      <div class="form-field">
        <label>Motivo</label>
        <input type="text" id="esMotivo" placeholder="Ej: Pago a proveedor, cambio de caja, retiro...">
      </div>
      <div style="font-size:12px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:0.5px;margin:16px 0 8px;">Movimientos de hoy</div>
      <div id="movCajaLista"></div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeModal('modalEntradaSalida')">Cerrar</button>
      <button class="btn btn-primary" onclick="registrarMovimientoCaja()"><i class="fa fa-floppy-disk"></i> Registrar</button>
    </div>
  </div>
</div>

<!-- ===== MODAL: VENTAS PENDIENTES ===== -->
<div class="modal-overlay" id="modalPendientes">
  <div class="modal modal-alto-fijo" style="max-width:440px;--alto:520px;">
    <div class="modal-header">
      <h3><i class="fa fa-clock" style="color:#eab308;margin-right:8px;"></i>Ventas Pendientes</h3>
      <div class="modal-close" onclick="closeModal('modalPendientes')"><i class="fa fa-xmark"></i></div>
    </div>
    <div class="modal-body">
      <div id="pendienteGuardarZona" style="display:none;margin-bottom:16px;padding-bottom:14px;border-bottom:1px dashed var(--border);">
        <div class="form-field">
          <label>Nombre para identificar esta venta (opcional)</label>
          <input type="text" id="pendienteNombre" placeholder="Ej: Mesa 2, Cliente de la esquina...">
        </div>
        <button class="btn btn-primary" style="width:100%;" onclick="guardarComoPendiente()"><i class="fa fa-pause"></i> Dejar carrito actual como Pendiente</button>
      </div>
      <div style="font-size:12px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:8px;">Carritos en espera</div>
      <div id="pendientesLista"></div>
    </div>
  </div>
</div>

<!-- ===== MODAL: HISTORIAL DE VENTAS (ventas del día + devoluciones, en uno solo) ===== -->
<div class="modal-overlay" id="modalHistorialVentas">
  <div class="modal" style="max-width:840px;">
    <div class="modal-header">
      <h3><i class="fa fa-receipt" style="color:#3b82f6;margin-right:8px;"></i>Ventas/Devoluciones</h3>
      <div class="modal-close" onclick="closeModal('modalHistorialVentas')"><i class="fa fa-xmark"></i></div>
    </div>
    <div class="modal-body" style="padding:0;">
      <!-- Altura fija: no cambia al elegir un ticket, igual que la ventana de Cobrar -->
      <div style="display:flex;flex-wrap:wrap;height:540px;">

        <!-- Columna izquierda: buscador + filtro de fecha + lista de tickets -->
        <div style="flex:1 1 320px;min-width:270px;border-right:1px solid var(--border);display:flex;flex-direction:column;height:100%;">
          <div style="padding:16px 16px 10px;flex-shrink:0;">
            <div class="table-search" style="max-width:none;width:100%;">
              <i class="fa fa-magnifying-glass"></i>
              <input type="text" id="histBuscarInput" placeholder="Buscar ticket o cliente..." autocomplete="off" oninput="histRenderLista()">
            </div>
          </div>

          <div id="histResumen" style="padding:0 16px;display:flex;gap:8px;margin-bottom:10px;flex-shrink:0;"></div>

          <div id="histLista" style="flex:1;overflow-y:auto;padding:0 8px;"></div>

          <div style="flex-shrink:0;padding:12px 16px;border-top:1px solid var(--border);">
            <div style="display:flex;align-items:center;gap:6px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:4px 6px 4px 10px;margin-bottom:8px;">
              <i class="fa fa-calendar" style="color:var(--text3);font-size:12px;"></i>
              <span style="font-size:11px;color:var(--text3);flex-shrink:0;">Del día:</span>
              <input type="date" id="histFechaInput" onchange="histRenderLista()" style="flex:1;min-width:0;background:transparent;border:none;color:var(--text);font-family:'Sora',sans-serif;font-size:12px;outline:none;cursor:pointer;">
              <button class="btn btn-secondary btn-sm" onclick="histIrHoy()" style="flex-shrink:0;padding:4px 8px;"><i class="fa fa-calendar-day"></i> Hoy</button>
            </div>
            <div style="display:flex;align-items:center;gap:6px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:6px 10px;">
              <span style="font-size:11px;color:var(--text3);flex-shrink:0;">Cajero:</span>
              <select id="histCajeroInput" onchange="histRenderLista()" style="flex:1;min-width:0;background:transparent;border:none;color:var(--text);font-family:'Sora',sans-serif;font-size:12px;outline:none;cursor:pointer;">
                <option value="">Todos</option>
              </select>
            </div>
          </div>
        </div>

        <!-- Columna derecha: detalle del ticket seleccionado (encabezado fijo arriba, botones fijos abajo) -->
        <div id="histDetalle" style="flex:1 1 380px;min-width:300px;height:100%;display:flex;flex-direction:column;position:relative;">
          <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--text3);">
            <i class="fa fa-receipt" style="font-size:32px;display:block;margin-bottom:10px;opacity:0.3;"></i>
            <p style="font-size:13px;">Selecciona un ticket para ver el detalle</p>
          </div>
        </div>

      </div>
    </div>
  </div>
</div>
