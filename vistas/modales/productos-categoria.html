<!-- Modal: Productos de Categoría -->
<div class="modal-overlay" id="modalProductosCategoria">
  <div class="modal" style="max-width:520px;">
    <div class="modal-header">
      <h3 id="modalProdCatTitle"><i class="fa fa-tag" style="color:var(--accent);margin-right:8px;"></i>Productos</h3>
      <div class="modal-close" onclick="closeModal('modalProductosCategoria')"><i class="fa fa-xmark"></i></div>
    </div>
    <div class="modal-body" style="padding:0;">
      <div id="modalProdCatList" style="max-height:420px;overflow-y:auto;"></div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeModal('modalProductosCategoria')">Cerrar</button>
    </div>
  </div>
</div>
