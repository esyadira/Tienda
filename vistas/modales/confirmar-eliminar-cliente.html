<!-- Modal Confirmar Eliminar Cliente -->
<div class="modal-overlay" id="modalConfirmDelCliente">
  <div class="modal" style="max-width:400px;">
    <div class="modal-header">
      <h3><i class="fa fa-triangle-exclamation" style="color:var(--danger);margin-right:8px;"></i>Eliminar Cliente</h3>
      <div class="modal-close" onclick="closeModal('modalConfirmDelCliente')"><i class="fa fa-xmark"></i></div>
    </div>
    <div class="modal-body" style="text-align:center;padding:28px 24px;">
      <div style="width:56px;height:56px;border-radius:50%;background:rgba(239,68,68,0.12);border:2px solid rgba(239,68,68,0.3);display:flex;align-items:center;justify-content:center;margin:0 auto 16px;font-size:22px;color:var(--danger);">
        <i class="fa fa-user-xmark"></i>
      </div>
      <p style="font-size:13px;color:var(--text2);margin-bottom:8px;">¿Estás segura que quieres eliminar a:</p>
      <div id="confirmDelClienteNombre" style="font-size:20px;font-weight:800;color:var(--text);margin-bottom:6px;letter-spacing:-0.5px;"></div>
      <div id="confirmDelClienteTel" style="font-size:12px;color:var(--text3);margin-bottom:20px;"></div>
      <div style="background:rgba(239,68,68,0.07);border:1px solid rgba(239,68,68,0.2);border-radius:8px;padding:10px 14px;font-size:12px;color:var(--danger);margin-bottom:4px;">
        <i class="fa fa-circle-info" style="margin-right:6px;"></i>Se borrará su historial y deuda. Esta acción no se puede deshacer.
      </div>
    </div>
    <div class="modal-footer" style="justify-content:space-between;">
      <button class="btn btn-secondary" onclick="closeModal('modalConfirmDelCliente')" style="flex:1;">Cancelar</button>
      <button class="btn" id="confirmDelClienteBtn" style="flex:1;background:var(--danger);color:#fff;border:none;margin-left:10px;" onclick="confirmarEliminarCliente()">
        <i class="fa fa-trash" style="margin-right:6px;"></i>Sí, eliminar
      </button>
    </div>
  </div>
</div>
