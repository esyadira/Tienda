<!-- Modal Efectivo Inicial (Flotante) -->

    <div class="modal-header">
      <h3><i class="fa fa-wallet" style="color:#10b981;margin-right:8px;"></i>Efectivo con el que iniciaron hoy</h3>
      <div class="modal-close" onclick="closeModal('modalCajaDetalle')"><i class="fa fa-xmark"></i></div>

      <div id="cajaDetalleLista"></div>

    <div class="modal-footer">

    </div>
  </div>
