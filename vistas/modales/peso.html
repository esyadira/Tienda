<!-- Modal Peso Producto POS -->
<div class="modal-overlay" id="modalPeso">
  <div class="modal" style="max-width:360px;">
    <div class="modal-header"><h3><i class="fa fa-scale-balanced" style="color:var(--accent);margin-right:8px;"></i>Ingresar Peso</h3><div class="modal-close" onclick="closeModal('modalPeso')"><i class="fa fa-xmark"></i></div></div>
    <div class="modal-body" style="text-align:center;">
      <div id="pesoProductoNombre" style="font-size:15px;font-weight:700;margin-bottom:4px;"></div>
      <div id="pesoPrecioPorKg" style="font-size:12px;color:var(--text3);margin-bottom:20px;"></div>
      <div class="form-field">
        <label>¿Cuánto pesa? (kg)</label>
        <input type="number" id="pesoKgInput" placeholder="0.000" step="0.001" min="0"
          style="width:100%;padding:14px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text);font-family:'Sora',sans-serif;font-size:22px;font-weight:700;text-align:center;"
          oninput="calcPrecioByPeso()">
      </div>
      <div id="pesoTotalPrecio" style="margin-top:14px;padding:14px;border-radius:10px;background:rgba(245,158,11,0.1);border:1px solid rgba(245,158,11,0.3);font-size:20px;font-weight:800;color:var(--accent);display:none;"></div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeModal('modalPeso')">Cancelar</button>
      <button class="btn btn-primary" onclick="agregarProductoPorPeso()"><i class="fa fa-plus"></i> Agregar al Carrito</button>
    </div>
  </div>
</div>
