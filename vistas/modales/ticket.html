<!-- Modal Ticket -->
<div class="modal-overlay" id="modalTicket">
  <div class="modal" style="max-width:400px;">
    <div class="modal-header"><h3><i class="fa fa-receipt" style="color:var(--accent3);margin-right:8px;"></i>Venta Registrada</h3><div class="modal-close" onclick="closeModal('modalTicket')"><i class="fa fa-xmark"></i></div></div>
    <div class="modal-body">
      <div id="ticketContent"></div>
      <div style="display:flex;gap:8px;margin-top:16px;">
        <button class="btn btn-secondary" style="flex:1;" onclick="closeModal('modalTicket')"><i class="fa fa-xmark"></i> Cerrar</button>
        <button class="btn btn-primary" style="flex:1;" onclick="imprimirTicket()"><i class="fa fa-print"></i> Imprimir</button>
      </div>
    </div>
  </div>
</div>
